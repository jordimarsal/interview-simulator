# SonarQube scanner defaults — picked up automatically by
# ~/homelab/sonarqube/analyze.sh when the scanner runs from the repo root.
sonar.projectKey=jordimarsal:interview-simulator
sonar.sourceEncoding=UTF-8

# node_modules is third-party code; .claude/.opencode/harness state is agent
# tooling, not shipped code. This list replaces the scanner's default
# exclusions entirely, so the standard build-output patterns are kept too.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/vendor/**,**/coverage/**,**/.claude/**,**/.opencode/**
